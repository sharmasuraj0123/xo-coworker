<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#141414">
  <script>try{var d=document.documentElement,t=localStorage.getItem("cv-theme"),f=localStorage.getItem("cv-flavour");if(t==="system")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";d.dataset.theme=t==="light"?"light":"dark";if(f&&f!=="stone"&&/^[a-z-]+$/.test(f))d.dataset.flavour=f}catch(e){document.documentElement.dataset.theme="dark"}</script>
  <script>try{if(localStorage.getItem("cv-bubbles")==="on"){document.documentElement.dataset.msgx="bubbles";document.documentElement.dataset.msgxTails=""}}catch(e){}</script>
  <title>XO Space</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preload" href="./fonts/geist/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./core/ui/foundation.css">
  <link rel="stylesheet" href="./vendor/xterm/xterm.css">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/light.css">
  <link rel="stylesheet" href="./css/foundation.css">
  <link rel="stylesheet" href="./css/panel.css">
  <link rel="stylesheet" href="./css/diffs.css">
  <link rel="stylesheet" href="./css/launchpad.css">
  <link rel="stylesheet" href="./css/links.css">
  <link rel="stylesheet" href="./css/artifacts.css">
  <link rel="stylesheet" href="./core/ui/components/xo-select.css">
  <link rel="stylesheet" href="./modules/conversation/media/media.css">
  <link rel="stylesheet" href="./css/shape.css">
  <link rel="stylesheet" href="./shell/sidebar.css">
  <link rel="stylesheet" href="./modules/conversation/msgx.css">
  <link rel="stylesheet" href="./core/ui/markdown/rich.css">
  <link rel="stylesheet" href="./css/docs.css">
  <link rel="stylesheet" href="./css/phone.css">
</head>
<body>
  <div class="app" id="app">
    <section id="rail-project-settings" popover aria-label="Project settings"></section>
    <div class="side-peek">
      <button type="button" class="side-ib" data-side-peek aria-label="Show sidebar" aria-controls="side" aria-expanded="false"></button>
      <button type="button" class="side-ib" data-go="chats" aria-label="New chat"></button>
    </div>
    <div class="side-edge" aria-hidden="true"></div>
    <aside class="side" id="side" aria-label="Navigation">
      <div class="side-top">
        <button type="button" class="side-ib side-fold" id="side-fold" aria-controls="side" aria-expanded="true" aria-label="Fold the sidebar"></button>
        <p class="brand"><span class="brand-mark" id="brand-mark"></span><span class="sr-only">XO </span><b>Space</b></p>
        <button type="button" class="side-x" id="side-x" aria-label="Close menu"></button>
      </div>
        <button type="button" class="nrow" data-go="chats" id="nv-chats"><span class="nr-ic" id="ic-chats"></span><span class="nr-name">New chat</span></button>
      <nav class="nav" aria-label="Main">
        <button type="button" class="nrow" data-go="home" id="nv-home"><span class="nr-ic" id="ic-home"></span><span class="nr-name">Home</span><span class="nr-n" id="home-n"></span></button>
        <button type="button" class="nrow" id="side-jump">
          <span class="nr-ic" data-search-icon></span><span class="nr-name">Search</span>
        </button>
        <button type="button" class="nrow" data-go="artifacts" id="nv-arts"><span class="nr-ic" id="ic-arts"></span><span class="nr-name">Artifacts</span></button>
        <button type="button" class="nrow" data-go="launchpad" id="nv-lp" hidden><span class="nr-ic" id="ic-lp"></span><span class="nr-name">Launchpad</span></button>
        <button type="button" class="nrow" id="nv-more" aria-haspopup="menu" aria-expanded="false" aria-controls="side-more"><span class="nr-ic" id="ic-more"></span><span class="nr-name">More</span><span class="nr-chev" aria-hidden="true"></span></button>
      </nav>
      <div class="side-pop" id="side-more" role="menu" aria-label="More places" tabindex="-1" hidden></div>
      <div class="side-label">
        <button id="projects-label" type="button" aria-expanded="true" aria-controls="projects nv-ws project-overflow">Projects</button>
        <button type="button" class="side-plus" id="side-add" aria-label="New project" title="New project"><span id="sc-ic"></span></button>
      </div>
        <button type="button" class="nrow" data-go="ws" id="nv-ws"><span class="nr-ic" id="ic-ws"></span><span class="nr-name">All projects</span><span class="nr-n" id="ws-n"></span></button>
      <nav class="projects" id="projects" aria-labelledby="projects-label"></nav>
      <button type="button" class="nrow" id="project-overflow" data-project-list popovertarget="rail-project-picker" hidden>
        See all <span data-total></span>
      </button>
      <section id="rail-project-picker" popover aria-label="Projects">
        <input type="search" aria-label="Find a project" placeholder="Find a project…" autofocus>
        <nav aria-label="Matching projects"></nav>
        <button type="button" class="nrow" data-new-project>New project…</button>
      </section>
      <details class="side-recents" open hidden>
        <summary>Recents</summary>
        <nav aria-label="Recent chats"></nav>
        <button type="button" class="nrow" data-go="chats" data-chat-history>See all <span data-total></span></button>
      </details>
      <div class="side-foot">
        <button type="button" class="gear is-ic sh-tog" id="nv-shells" aria-pressed="false" aria-label="Shells" hidden><span class="gear-ic" id="ic-shells"></span><span class="sh-n"></span></button>

        <button type="button" class="gear is-ic" id="set-side" title="Settings" aria-label="Settings" aria-haspopup="true" aria-expanded="false"><span class="gear-ic" id="set-side-ic"></span></button>
      </div>
    </aside>
    <div class="side-scrim" id="side-scrim" hidden></div>

    <main class="main" id="main">
      <header class="phonebar" id="phonebar">
        <button type="button" class="pb-menu" id="pb-menu" aria-label="Open menu" aria-controls="side" aria-expanded="false"></button>
        <span class="pb-t" id="pb-t"></span>
        <button type="button" class="help gear" id="set-phone" aria-label="Settings" title="Settings"></button>
      </header>

      <section class="home" id="home" aria-labelledby="home-h" tabindex="-1"></section>

      <section class="conv" id="conv" hidden>
        <header class="top" id="top">
          <button type="button" class="top-menu" id="top-menu" aria-label="Open menu" aria-controls="side" aria-expanded="false"></button>
          <button type="button" class="top-back" id="top-back" hidden></button>
          <div class="top-who" id="top-who"></div>
          <div class="top-end" id="top-end"></div>
        </header>
        <div class="thead" id="thead" hidden></div>
        <div class="tdel" id="tdel" hidden></div>
        <div class="since" id="since" hidden></div>
        <div class="scroller" id="scroller" tabindex="-1" data-own-scroll>
          <h1 class="cs-hi" id="cs-hi" hidden>What are we working on?</h1>
          <div class="column" id="column">
            <div class="ws-head" id="ws-head" hidden></div>
            <div class="msgs" id="msgs" role="log" aria-live="off" aria-label="Messages"></div>
            <div class="typing-slot" id="typing"></div>
          </div>
        </div>
      </section>
      <div class="drop-veil" id="drop-veil" hidden><p><span id="drop-ic"></span>Drop to attach · text, images or PDFs, up to 25 MB each</p></div>

      <div class="dock" id="dock">
        <div class="herald" id="herald" aria-live="polite"></div>
        <div class="tdock" id="tdock"></div>
        <div class="cbar">
        <form class="composer" id="composer" autocomplete="off">
          <label class="sr-only" for="say" id="say-label">Message</label>
          <ul class="att-tray" id="att-tray" aria-label="Files on this message" hidden></ul>
          <div class="cref" id="cref" hidden></div>
          <div class="composer-field">
            <textarea id="say" rows="1" placeholder="Message" aria-autocomplete="list" aria-controls="at-list" aria-expanded="false" spellcheck="true"></textarea>
            <ul id="at-list" class="at-list" role="listbox" aria-label="Projects" hidden></ul>
          </div>
          <div class="composer-row">
            <button type="button" class="attach" id="attach" aria-label="Add files" aria-describedby="att-note" title="Add files: text, images or PDFs, up to 25 MB each"></button>
            <input type="file" id="att-input" multiple hidden tabindex="-1" accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,text/*,.md,.markdown,.txt,.csv,.tsv,.json,.jsonl,.yaml,.yml,.toml,.ini,.xml,.html,.css,.js,.mjs,.ts,.tsx,.jsx,.py,.rb,.go,.rs,.java,.kt,.c,.h,.cpp,.hpp,.cs,.php,.sh,.sql,.log,.diff,.patch,.svg">
            <button type="button" class="target" id="target" title="Aim at a project (@)"></button>
            <button type="button" class="target cs-perm" id="cs-perm" aria-haspopup="dialog" aria-expanded="false" aria-controls="cs-pop" hidden></button>
            <button type="button" class="tg-now" id="send-now" aria-pressed="false" title="Stop the turn in progress and send this now" hidden>Send now</button>
            <button type="button" class="iq" id="iq" aria-haspopup="dialog" aria-expanded="false" aria-controls="iq-pop"></button>
            <button type="submit" class="send" id="send" aria-label="Send" title="Send (Enter)" disabled></button>
          </div>
          <p class="att-note" id="att-note" hidden>Files are kept in the project's <code>.xo/</code> folder. Unlike chat text, they aren't scrubbed for secrets.</p>
        </form>
        </div>
      </div>

    </main>
  </div>

  <script type="module" src="./modules/home/skeleton.js"></script>
  <script type="module" src="./boot.js"></script>
</body>
</html>
