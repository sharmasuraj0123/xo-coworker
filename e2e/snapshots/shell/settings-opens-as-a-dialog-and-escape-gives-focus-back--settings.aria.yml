- dialog "Settings":
  - heading "Settings" [level=1]
  - button "Close settings"
  - tablist "Settings":
    - tab "General" [selected]
    - tab "Shape"
    - tab "Routing"
    - tab "Runtimes"
    - tab "Rules"
    - tab "Worktrees"
    - tab "Sounds"
    - tab "Keyboard"
  - tabpanel "General":
    - heading "General" [level=2]
    - paragraph: How the conversation shows what happens behind it.
    - text: Chat bubbles Messages in bubbles, as in a messaging app. Off, an agent's reply reads as a full-width document, with room for its math, code, charts and diagrams. Only on this device.
    - switch "Chat bubbles"
    - text: Show how messages travel Inside a thread, a quiet line each time a message passes between the workspace, a project's coordinator and the thread. Off unless you turn it on.
    - switch "Show how messages travel"
    - text: Show pictures from the web A picture an agent links to shows in the conversation, read straight from its site, which can tell someone looked. Off, it's a link. Only on this device.
    - switch "Show pictures from the web" [checked]
