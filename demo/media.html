<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XO · pictures and files in the conversation (demo)</title>
<!-- A demo of js/media.js and js/lightbox.js with sample data, since Storm's w, h and tint aren't live yet
     (xo-space 2918587). It loads the app's own stylesheets and modules and makes no network calls beyond
     this folder's files: every picture is a real PNG from design-research/, its w × h read from the file
     and its tint measured as its average colour. ?theme=light|dark, or the switch at the top. -->
<script>
  try {
    const q = new URLSearchParams(location.search).get("theme");
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : localStorage.getItem("cv-theme") === "light" ? "light" : "dark";
  } catch { document.documentElement.dataset.theme = "dark"; }
</script>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/light.css">
<link rel="stylesheet" href="../css/foundation.css">
<link rel="stylesheet" href="../css/panel.css">
<link rel="stylesheet" href="../css/links.css">
<link rel="stylesheet" href="../css/media.css">
<style>
  /* the demo's own frame only: a page that scrolls, a line saying what this is, the app's column */
  html,body{height:auto}
  body{overflow:auto;background:var(--canvas)}
  .demo-h{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 28px;background:var(--canvas);border-bottom:1px solid var(--line-soft)}
  .demo-h p{flex:1;min-width:0;font:400 var(--fs-xs)/var(--lh-12) var(--sans);color:var(--ink-4)}
  .demo-h b{font-weight:500;color:var(--ink-2)}
  .demo-h button{height:28px;padding:0 10px;border-radius:var(--r);background:var(--hover-fill);font:500 var(--fs-base)/var(--lh-13) var(--sans);color:var(--ink-2)}
  .demo-b{padding:28px 28px 96px}
  .demo-note{position:fixed;left:50%;bottom:24px;z-index:6;transform:translateX(-50%);padding:6px 12px;border-radius:var(--r);background:var(--bg-3);font:400 var(--fs-xs)/var(--lh-12) var(--sans);color:var(--ink-2)}
  @media (max-width:760px){.demo-h{padding:10px 16px}.demo-b{padding:20px 16px 96px}}
</style>
</head>
<body>
  <header class="demo-h">
    <p><b>Pictures and files in the conversation</b> · a demo with sample data (Storm's w, h and tint aren't live yet). Click a picture; ← → walk through them all; Esc puts it back.</p>
    <button type="button" id="theme"></button>
  </header>
  <main class="demo-b">
    <div class="column"><div class="msgs" id="msgs" role="log" aria-label="Messages"></div></div>
  </main>
  <p class="demo-note" id="note" role="status" hidden></p>

<script type="module">
import { mediaHtml, mediaItem, hydrateMedia, wireDragOut, mediaItemOf, retryMedia } from "../js/media.js";
import { createLightbox } from "../js/lightbox.js";
import { ICON } from "../js/ui.js";
import { renderMarkdown } from "../js/markdown.js";

const A = "../design-research/2026-11-vision/audit/shots/";
const C = "../design-research/2026-11-vision/chat/shots/";
const AGENT = "xo-coworker agent";
const today = (h, m) => { const d = new Date(); d.setHours(h, m, 0, 0); return d.getTime(); };
// each also names its place in the project, as an agent's file does, so the lightbox offers Open in Files
const inRepo = (src) => ({ project: "xo-coworker", rel: src.replace(/^\.\.\//, ""), path: src.replace(/^\.\.\//, "") });
const pic = (file, w, h, tint, bytes) => ({ name: file.split("/").pop(), type: "image/png", src: file, w, h, tint, bytes, ...inRepo(file) });

// the sample conversation: w × h are the files' own, tint their measured average colour
const MSGS = [
  { who: "you", at: today(10, 41), text: "This is what the viewer looks like on my side. Can the conversation show pictures like this?",
    files: [{ name: "14-viewer-light.png", type: "image/png", src: A + "14-viewer-light.png", bytes: 582397 }] }, // an older upload: no w, h or tint at all
  { who: "agent", at: today(10, 44), text: "Yes. Here is a thread as it renders now:",
    files: [pic(A + "07-thread-dark.png", 2880, 1800, "#1a1a1a", 317477)] },
  { who: "agent", at: today(10, 45), cont: true, text: "Home, a project and Artifacts, side by side:",
    files: [pic(A + "00-home-light.png", 2880, 1800, "#232323", 322143), pic(A + "06-project-dark.png", 2880, 1800, "#1b1b1b", 326074), pic(A + "13-artifacts-light.png", 2880, 1800, "#dfdfdf", 550358)] },
  { who: "agent", at: today(10, 46), cont: true, text: "And every screen from the audit, in order:",
    files: [pic(A + "01-home-dark.png", 2880, 1800, "#232424", 331479), pic(A + "03-workspace-light.png", 2880, 1800, "#f5f5f5", 264723), pic(A + "04-chats-dark.png", 2880, 1800, "#161616", 172083),
      pic(A + "05-artifacts-light.png", 2880, 1800, "#e0e0e0", 522398), pic(A + "09-composer-picker-dark.png", 2880, 1800, "#1a1a1a", 360005), pic(A + "10-jump-light.png", 2880, 1800, "#dcdcdc", 332742)] },
  { who: "you", at: today(10, 52), text: "And on the phone?",
    files: [pic(A + "15-phone-home-light.png", 780, 1688, "#ededed", 132717), pic(A + "16-phone-menu-light.png", 780, 1688, "#e8e7e8", 114432)] },
  { who: "agent", at: today(10, 54), text: "A phone capture from before the server sent sizes. It gets a fixed 16:10 frame and is fitted inside it, so nothing moves when it loads:",
    files: [pic(A + "15-phone-home-dark.png", null, null, null, 134069)] },
  { who: "agent", at: today(10, 55), cont: true, text: "The mark, as an SVG (it has no pixel size, so the server sends `w` and `h` as null):",
    files: [{ name: "favicon.svg", type: "image/svg+xml", src: "../favicon.svg", w: null, h: null, tint: null, bytes: 572, ...inRepo("../favicon.svg") }] },
  { who: "agent", at: today(10, 57), cont: true, text: "The chat proposal's mock as one long capture, and the proposal itself:",
    files: [pic(C + "mock-light.png", 2880, 8298, "#f2f3f2", 588850),
      { name: "proposal.md", type: "text/markdown", bytes: 41210, path: "design-research/2026-11-vision/chat/proposal.md", project: "xo-coworker", rel: "design-research/2026-11-vision/chat/proposal.md" }] },
];

const clockOf = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function messageHtml(m, i) {
  const items = m.files.map((f, j) => mediaItem({ ...f, key: `demo:${i}:${j}`, by: m.who === "you" ? "You" : AGENT, at: m.at }));
  if (m.who === "you") {
    return `<div class="m m-you${m.cont ? " cont" : ""}">${mediaHtml(items, { side: "you" })}<div class="bubble" title="${esc(clockOf(m.at))}">${esc(m.text)}</div></div>`;
  }
  return `<div class="m m-them${m.cont ? " cont" : ""}">${m.cont ? `<div class="av av-gap"></div>` : `<div class="av av-t">${ICON.thread}</div>`}<div class="mb">` +
    (m.cont ? "" : `<div class="mh"><b>${AGENT}</b><span class="role">media-demo</span><time>${clockOf(m.at)}</time></div>`) +
    `<div class="prose">${renderMarkdown(m.text)}</div>${mediaHtml(items, { side: "them" })}</div></div>`;
}

const msgs = document.getElementById("msgs");
msgs.innerHTML = `<div class="day" role="separator"><span>Today</span></div>` + MSGS.map(messageHtml).join("");
hydrateMedia(msgs);
wireDragOut(msgs);

const note = document.getElementById("note");
let noteT = 0;
const say = (text) => { note.textContent = text; note.hidden = false; clearTimeout(noteT); noteT = setTimeout(() => { note.hidden = true; }, 2600); };
const LB = createLightbox({ openFile: (it) => say(`In the app, ${it.name} opens in Files.`), announce: () => {} });
msgs.addEventListener("click", (e) => {
  const el = e.target.closest("[data-mx]");
  if (!el || retryMedia(el)) return;
  const it = mediaItemOf(el.dataset.mx);
  if (it && it.kind === "image") LB.open(it.key, el, msgs);
  else if (it) say(`In the app, ${it.name} opens in the viewer beside the conversation.`);
});

const tb = document.getElementById("theme");
const paint = () => { tb.textContent = document.documentElement.dataset.theme === "light" ? "Dark" : "Light"; tb.setAttribute("aria-label", `Switch to ${tb.textContent.toLowerCase()}`); };
tb.addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("cv-theme", next); } catch { /* private mode */ }
  paint();
});
paint();
</script>
</body>
</html>
